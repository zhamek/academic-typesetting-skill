# typeset.yaml —— build.py 的配置模板
# 路径一律相对于本文件所在目录。

# ---- 单栏课程报告 ----
source: src/report.md
output: output/report.pdf
engine: pandoc            # pandoc | quarto
class: article            # 纯中文可用 ctexart
fontsize: 11pt
papersize: a4
geometry: top=2.2cm,bottom=2.2cm,left=2.5cm,right=2.5cm
header: <SKILL>/templates/header-cn.tex     # 换成实际的 skill 路径
bibliography: references.bib
csl: <SKILL>/templates/nature.csl
number_sections: true
resource_path: [".", "src", "assets"]
lang: zh
fonts: SimSun,SimHei,TimesNewRoman      # 交给 qa_pdf.py 的 --fonts；用思源宋体就换掉

# ---- 双栏论文：把上面三行换成下面四行 ----
# class: article
# classoption: twocolumn
# fontsize: 10pt
# header: <SKILL>/templates/header-paper.tex

# ---- GB/T 7714 参考文献（中文报告/学位论文）----
# 把 citations 改成 gbt，build.py 会走 pandoc --natbib + bibtex 四遍编译。
# header 仍用 header-cn.tex（它内部按 \usegbt 加载 gbt7714）。
# citations: gbt
# bibliography: references.bib
# 注意：csl 这一项在 gbt 模式下不用写。

# ---- 出 Word（不需要 pdf-engine 与 geometry）----
# output: output/report.docx
